# docker-compose.snippet.yml -- merge into the existing onchain-snapshot-api
# service definition in alpha1's docker-compose.yml. Two additions only:
# a volume so the NDJSON store survives redeploys, and the ingest key as an
# env var (or set it as a stack-level variable in Portainer's UI instead,
# same as this project already does for CDP_API_KEY_ID/SECRET).

services:
  onchain-snapshot-api:
    # ...existing service config unchanged...
    volumes:
      # ...existing volumes, if any...
      - edge-data:/app/data
    environment:
      # ...existing environment entries unchanged...
      - EDGE_INTERNAL_KEY=${EDGE_INTERNAL_KEY}
      - EDGE_RETENTION_DAYS=${EDGE_RETENTION_DAYS:-30}

volumes:
  # ...existing named volumes, if any...
  edge-data:
